name: Validate extension
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run package
  browser:
    name: Chromium extension smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Test the unpacked extension with local synthetic media
        run: npm run test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
