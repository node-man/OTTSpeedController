<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 속도계 배경 (비활성 - 회색) -->
  <circle cx="64" cy="64" r="56" fill="#2a2a2a" stroke="#666666" stroke-width="4"/>
  
  <!-- 속도 눈금 (회색) -->
  <g stroke="#666666" stroke-width="3" stroke-linecap="round">
    <line x1="64" y1="20" x2="64" y2="32"/>
    <line x1="28" y1="64" x2="40" y2="64"/>
    <line x1="100" y1="64" x2="88" y2="64"/>
    <line x1="34" y1="34" x2="43" y2="43"/>
    <line x1="94" y1="34" x2="85" y2="43"/>
  </g>
  
  <!-- 속도계 바늘 (정지 상태) -->
  <g transform="rotate(-45, 64, 64)">
    <polygon points="64,24 58,64 64,72 70,64" fill="#888888"/>
    <circle cx="64" cy="64" r="8" fill="#666666"/>
  </g>
  
  <!-- 속도 텍스트 (회색) -->
  <text x="64" y="100" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#666666" text-anchor="middle">SPEED</text>
</svg>
